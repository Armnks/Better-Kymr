        <link rel="preconnect" href="https://api.fontshare.com" />
        <link
            href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
            rel="stylesheet"
        />
        <!-- Two working families plus one brand face. Cormorant/Spectral were
             dropped: long serif body copy and serif-labelled-as-mono metadata
             were the most dated part of the old system, and removing them also
             removes a font request.

             Trimmed again on 2026-09-07 against what the pages actually
             render: cabinet-grotesk had ZERO references anywhere in the
             source, and Cinzel 900 and IBM Plex Mono 500 were never used
             either. Browsers only fetch faces that get used, so none of
             this was costing bytes - it was the stylesheet claiming a type
             system wider than the one on screen. Every weight still listed
             below is one the site genuinely sets.

             2026-09-08: IBM Plex Mono is OUT, replaced by DM Sans. It set
             every eyebrow, every 01/02/03 and every piece of small
             metadata on the site, and wide-tracked monospace on a dark
             page is the single most recognisable machine-made tell there
             is - the look reads as generated whatever the words say.
             DM Sans is the closest openly-licensed face to Google Sans,
             which is what the owner asked for: geometric, low contrast,
             and legible at the 11-12px these labels actually run at,
             which a mono is not. Three weights, all of them used. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
            rel="stylesheet"
        />
        <!--
        manifest.json provides metadata used when your web app is installed on a

        -->

        <title>KymrStudio - Built to stand out. Designed to grow.</title>
